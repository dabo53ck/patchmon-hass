[project]
name = "patchmon-hass"
version = "0.1.0"
description = "Read-only Home Assistant integration for PatchMon: patch status of every monitored host."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["custom_components"]

[tool.ruff.lint]
# Pragmatic set: real-bug rules (pyflakes, bugbear, async), modernisation and
# import hygiene. Line length is left to the formatter, not the linter.
select = ["F", "E4", "E7", "E9", "W", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.patchmon_hass"]

[tool.mypy]
# Strict from day one; a CI gate (validate.yml), not advisory.
python_version = "3.14"
strict = true
files = ["custom_components/patchmon_hass"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Same folder for syrupy 6.0 (HA 2026.9) and 6.1+, where HA sets it itself.
addopts = "-q --snapshot-dirname=snapshots"

[tool.coverage.run]
source = ["custom_components/patchmon_hass"]

[tool.coverage.report]
fail_under = 95
show_missing = true
