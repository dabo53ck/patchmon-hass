name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Which part is this about?
      options:
        - Setup (config flow, re-authentication, options)
        - Entities (sensors, binary sensors, update entities)
        - Actions (get_hosts, get_packages, refresh)
        - Documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The use case or frustration behind the request, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: >
        The behaviour, entity, action or option you have in mind. Note that this
        integration is read-only by design: it never patches or changes hosts.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues.
          required: true
