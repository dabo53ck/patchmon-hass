name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Which part is this about?
      options:
        - Setup (add, re-authenticate, reconfigure, options)
        - Devices (PatchMon server, hosts added or removed)
        - Sensors and binary sensors
        - Update entities
        - Actions (get_hosts, get_packages, refresh)
        - Repair issues
        - Diagnostics
        - Documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The situation or frustration behind the request, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: >
        The behaviour, entity, action or option you have in mind. A rough sketch of
        the automation or dashboard that would use it helps a lot. Note that this
        integration is read-only by design: it never patches or changes hosts.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
      description: Templates, helpers, the actions of this integration, other integrations.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues.
          required: true
